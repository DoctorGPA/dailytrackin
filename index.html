.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}#dev{--fh:calc(100vh - 76px);min-height:100vh;padding:56px 12px 16px;display:flex;justify-content:center;align-items:flex-start}#wrap{position:relative;width:100%;transition:width .4s}#dev.d #wrap{width:min(1180px,100%)}#dev.p #wrap{width:392px}#frame{width:100%;height:var(--fh);background:var(--bg);overflow:auto;overflow-x:hidden;border:0 solid #34465a;transition:height .4s,border-radius .4s,border-width .4s,box-shadow .4s}#dev.d #frame{border:2px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px #426a8a26}#dev.p #frame{height:min(820px,var(--fh));border:11px solid #34465a;border-radius:46px;box-shadow:0 20px 50px #426a8a55}.notch{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#34465a;border-radius:0 0 14px 14px;z-index:6}#dev.p .notch{display:block}#dev.p main{padding-top:30px}#dev.bare{padding:0}#dev.bare #wrap{width:100%}#dev.bare #frame{height:auto;overflow:visible;border:0;border-radius:0;box-shadow:none}#dev.bare #app{min-height:100vh}#dev.m #app{display:flex;flex-direction:column}#dev.m main{order:1;flex:1;padding:12px;width:100%;overflow-x:hidden}#dev.m nav{order:2;position:sticky;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;border-top:2px solid var(--bd);border-right:0}#dev.m .logo,#dev.m nav .me{display:none}#dev.m nav a{flex-direction:column;font-size:10px;gap:0;padding:4px 8px;white-space:nowrap}#dev.m nav a.btn{margin-top:0!important}#dev.m .two{grid-template-columns:1fr}#dev.m .ev{flex-wrap:wrap}.sw{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:30;display:flex;background:var(--pri);border:2px solid var(--bd);border-radius:99px;padding:3px;gap:2px}.sw button{border:0;background:none;border-radius:99px;padding:4px 12px;font-weight:800;cursor:pointer;color:#26445e;transition:.25s;font-size:13px}.sw button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 6px #426a8a30}@media(max-width:760px){.sw{display:none}}.stars span{font-size:26px;cursor:pointer;color:#d6dfe8;transition:.15s}.stars span.on{color:#f5c542;transform:scale(1.1)}.stage.cl{aspect-ratio:4/3;container-type:inline-size}.stage canvas.on{z-index:999!important}.ob{position:absolute;cursor:grab;user-select:none;touch-action:none;transform-origin:center}.ob img{display:block;width:100%;height:auto;pointer-events:none;border-radius:4px;box-shadow:0 2px 8px #0003}.ob.s{line-height:1}.ob.sel{outline:2px dashed var(--deep)}.hd{display:none;position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--deep)}.sel .hd{display:block}.rs{right:-10px;bottom:-10px;cursor:nwse-resize}.rt{left:50%;top:-28px;margin-left:-9px}.dm .ob{pointer-events:none}.tag{background:var(--lav);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;display:inline-block;margin:2px}
.rx button{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:2px 9px;cursor:pointer;margin:2px}.rx button.on{background:var(--pri)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());

const FR={};

let page='home',sel=today(),e,tool=null,drawing=false,range=7,cm='',chat='',selSt=-1,und=[],red=[];

const ZOD=[['♑','Capricorn',20],['♒','Aquarius',19],['♓','Pisces',20],['♈','Aries',20],['♉','Taurus',21],['♊','Gemini',21],['♋','Cancer',22],['♌','Leo',23],['♍','Virgo',23],['♎','Libra',23],['♏','Scorpio',22],['♐','Sagittarius',22],['♑','Capricorn',31]];
const zod=d=>{if(!d)return'';const[,m,dd]=d.split('-').map(Number);const z=dd<ZOD[m-1][2]?ZOD[m-1]:ZOD[m];return z[0]+' '+z[1]};
const MOODS=['','Terrible','Very sad','Sad','A little down','Neutral','Okay','Good','Happy','Very happy','Amazing'],EM=['','😭','😢','🙁','😕','😐','🙂','😊','😄','🥰','🤩'];

const MSG=m=>m<=3?"It's okay to have difficult days. Be kind to yourself.":m<=6?"Some days are just ordinary, and that's okay.":"Look at you shining today!";
const STK='🐻🐰🐱🐶🦊🐼🐥🦋🌸🌷🌻🌼💗💙💛⭐🌟✨🌙☁️☀️🌈⛅🌧️☕🧋🍰🍓🍩🍙📚✏️🎧💻🏃🎬🛍️💤🎉🎀🍂🎃🎄🌸'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
const ICO=['☕','📚','🌸','💗','🎬','🛍️','💤','🏃','🍜','🎧','✈️','🎨','💻','🌧️','⭐'];
const QB={w:['Welcome in. This page is yours, and there is no wrong way to fill it.','Today is a fresh page. Write one small thing on it.','Noticing your day is already a kind thing to do.','A tiny memory saved today is a gift to future you.','No pressure, no rush. Just a moment for yourself.','Start wherever you are; that is a perfectly good place.','Good things grow slowly, and you have just planted one.'],c:['Heavy days pass through; you do not have to carry them alone.','Rest counts as progress too.','You are allowed to move slowly today.','Be as gentle with yourself as you would be with a friend.','Even the quietest days are part of your story.','It is okay to put today down and pick it up tomorrow.','Feelings are weather, and weather always changes.'],e:['You are still here and still trying, and that matters.','One small step is plenty for today.','Hope can be tiny and still be real.','Some days you walk, some days you just stand; both count.','Better days are being built from days like this.','You have made it through every hard day so far.','Take a breath, then take the next little step.'],p:['Little joys are adding up, so keep collecting them.','Your steady days are building something lovely.','Notice what is going well, even the small stuff.','A calm, good day is worth celebrating too.','You are growing in ways you cannot always see.','Keep the kindness you have been giving; it shows.','Today has room for one more good thing.'],h:['You are glowing lately; let yourself enjoy it!','Bright days deserve a happy dance.','Save this feeling in your diary and let it shine.','Your energy is contagious in the best way.','Celebrate how far you have come, loudly if you like.','This is what blooming looks like.','Go and make today even more fun than yesterday.']};
function dq(){const t=today();S.q=S.q||{used:{}};if(S.q.d==t&&S.q.t)return S.q.t;const w=new Date(t+'T00:00:00Z');w.setUTCDate(w.getUTCDate()-6);const a=dates().filter(d=>d>=w.toISOString().slice(0,10)).map(d=>S.d[d].mood),r=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,c=!a.length?'w':r<=3?'c':r<=5?'e':r<=7?'p':'h',P=QB[c];let u=S.q.used[c]||[];if(u.length>=P.length)u=[];const f=P.map((_,i)=>i).filter(i=>!u.includes(i)),i=f[Math.floor(Math.random()*f.length)];u.push(i);S.q.used[c]=u;S.q.d=t;S.q.t=P[i];save();return P[i]}
const blank=()=>({mood:7,text:'',ev:[{i:'✨',t:'',time:''}],ph:[],st:[],obj:[],title:'',dr:'',priv:'public',v:{m:1,t:0,p:1,e:1},draft:0,rx:{},me:'',cm:[]});
const load=d=>{e=JSON.parse(JSON.stringify(S.d[d]||blank()));e.obj=objs(e);e.title=e.title||'';e.ev.forEach(v=>{v.r=v.r||0});und=[];red=[];selSt=-1};
const dates=()=>Object.keys(S.d).filter(k=>!S.d[k].draft).sort();
const streak=(set,end=today())=>{let n=0,d=new Date(end+'T00:00:00Z');if(!set.has(end))d.setUTCDate(d.getUTCDate()-1);while(set.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}return n};
function confetti(){for(let i=0;i<40;i++){const c=document.createElement('div');c.className='cf';c.textContent=['🎉','✨','🌸','💙','⭐'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.append(c);setTimeout(()=>c.remove(),3400)}}
const NAV=[['home','🏠','Home'],['diary','📔','My Diary'],['network','🌍','Network'],['series','🌷','Series'],['messages','💬','Messages'],['notifs','🔔','Alerts'],['profile','🙂','Profile'],['settings','⚙️','Settings']];
function go(p){if(p=='rate'){const c=rc();if(c>=1&&!S.rv.some(r=>r.c==c))ratePop(c);else toast('Thanks — you have already rated this cycle 💛');return}page=p;if(p=='diary'&&!e)load(sel);render();scrollTo(0,0);$('#frame').scrollTop=0}
function render(){document.documentElement.dataset.theme=S.theme;
if(!S.user||(S.auth&&!ok()))return auth();const un=S.notifs.filter(n=>!n.r).length;

${NAV.map(n=>`<a class="${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}${n[0]=='notifs'&&un?`<span class="dot">${un}</span>`:''}</a>`).join('')}
<a class="btn" style="margin-top:auto;justify-content:center" onclick="sel=today();load(sel);go('diary')">✏️ Today’s diary</a></nav><main>${P[page]()}</main>`;
if(page=='diary')initDiary();if(page=='messages'){const m=$('.msgs');if(m)m.scrollTop=1e9}}
const P={};
/* ---------- ONBOARDING / PROFILE ---------- */
let ob={a:'🐱',tags:[]};

const h=`<div class="card" style="max-width:480px;margin:20px auto"><h1>${edit?'Edit profile':'Welcome to Daily Trackn’ '+LOGO(34)}</h1><p>A little space to track your days, feelings & memories.</p>${edit?'':'<div class="row"><button class="btn">Sign Up</button><button class="btn g" onclick="noAcc()">Log In</button></div>'}

${S.series.map((s,i)=>{const set=new Set(s.u.map(u=>u.d)),cur=streak(set),done=set.size;let lg=0,r=0,pr=null;[...set].sort().forEach(d=>{r=pr&&(new Date(d)-new Date(pr))==864e5?r+1:1;lg=Math.max(lg,r);pr=d});

<div class="row" style="margin:8px 0"><input id="u${i}" placeholder="Today’s update…" ${set.has(today())?'disabled':''}><button class="btn" ${set.has(today())?'disabled':''} onclick="upS(${i})">${set.has(today())?'Done today ✓':'Add update'}</button></div>${s.u.slice(-3).reverse().map(u=>`<div class="cm"><b>${u.d}</b> ${esc(u.t)}</div>`).join('')}</div>`}).join('')||'<div class="empty"><div>🌱</div>Nothing here yet. Start a series and grow a streak!</div>'}`;
function mkS(){const n=$('#sn').value.trim();if(!n)return toast('Name your series 🌷');S.series.push({n,e:$('#se').value||'🌷',t:+$('#st').value||0,p:$('#sp').value,s:today(),u:[],ms:[]});save();render()}

function sm(){const t=$('#mi').value.trim();if(!t||S.fr[chat]!=2)return;const tm=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit'});(S.msgs[chat]=S.msgs[chat]||[]).push({me:1,t,at:tm()});save();render();}

function pickImg(f){if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Please choose a JPG, PNG or WEBP image 🌸');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>crop(im);im.src=r.result};r.readAsDataURL(f)}
function crop(im){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card" style="text-align:center"><h3>Crop your avatar</h3><canvas id="kc" width="260" height="260" style="touch-action:none;max-width:100%;border-radius:16px;cursor:grab"></canvas><p><small>Drag to reposition · zoom to fit</small><br><input type="range" id="kz" min="1" max="3" step="0.01" value="1"></p><button class="btn" id="ky">Use this photo</button> <button class="btn g" id="kn">Cancel</button></div>';document.body.append(m);
const c=m.querySelector('#kc'),x=c.getContext('2d'),b=260/Math.min(im.width,im.height);let z=1,ox=0,oy=0,d=null;
const draw=ctx=>{const s=b*z,w=im.width*s,h=im.height*s,mx=(w-260)/2,my=(h-260)/2;ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));ctx.fillStyle='#fff';ctx.fillRect(0,0,260,260);ctx.drawImage(im,130-w/2+ox,130-h/2+oy,w,h)};
const paint=()=>{draw(x);x.fillStyle='rgba(30,50,70,.45)';x.beginPath();x.rect(0,0,260,260);x.arc(130,130,125,0,7,true);x.fill('evenodd')};paint();
m.querySelector('#kz').oninput=ev=>{z=+ev.target.value;paint()};c.onpointerdown=ev=>{d=[ev.clientX,ev.clientY,ox,oy];c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!d)return;const k=c.getBoundingClientRect().width/260;ox=d[2]+(ev.clientX-d[0])/k;oy=d[3]+(ev.clientY-d[1])/k;paint()};c.onpointerup=()=>d=null;
m.querySelector('#kn').onclick=()=>m.remove();m.querySelector('#ky').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=260;draw(o.getContext('2d'));ob.img=o.toDataURL('image/jpeg',.85);m.remove();obRe();toast('Avatar ready — press Save 💙')}}

function rd(f,cb){if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Please choose a JPG, PNG or WEBP image 🌸');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82),im.width,im.height)};im.src=r.result};r.readAsDataURL(f)}
function addPh(fs){[...fs].forEach(f=>rd(f,(src,w,h)=>{if(e.obj.filter(o=>o.t=='p').length>=10)return toast('Max 10 photos 📷');const n=e.obj.length%5;e.obj.push({t:'p',src,x:6+n*7,y:6+n*7,w:w>=h?34:22,r:0});selSt=e.obj.length-1;stage();tools();phs()}))}

function evs(){$('#evs').innerHTML=e.ev.map((v,i)=>`<div class="card" style="background:var(--bg);margin-bottom:8px"><div class="ev"><select onchange="e.ev[${i}].i=this.value">${[v.i,...ICO.filter(x=>x!=v.i)].map(x=>`<option>${x}</option>`).join('')}</select><input value="${esc(v.t)}" placeholder="What made this moment special?" oninput="e.ev[${i}].t=this.value"><button class="btn g" onclick="e.ev.splice(${i},1);if(!e.ev.length)e.ev.push({i:'✨',t:'',time:'',r:0});evs()">✕</button></div><div class="row"><span class="stars">${[1,2,3,4,5].map(n=>`<span class="${n<=v.r?'on':''}" onclick="rate(${i},${n})">★</span>`).join('')}</span><input type="time" style="width:110px" value="${v.time||''}" onchange="e.ev[${i}].time=this.value"></div></div>`).join('');const r=e.ev.filter(v=>v.r>0);$('#avg').textContent=r.length?`Today's little moments: ${(r.reduce((a,v)=>a+v.r,0)/r.length).toFixed(1)}/5 ⭐`:'Rate a moment to see your little moments score 🌱'}

function stage(){const s=$('#stage');s.className='stage cl'+(drawing?' dm':'');s.innerHTML='<canvas id="cv" width="1000" height="750"></canvas>'+e.obj.map(obHTML).join('');const c=$('#cv'),x=c.getContext('2d');c.classList.toggle('on',drawing);if(e.dr){const im=new Image();im.onload=()=>x.drawImage(im,0,0,1000,im.height*1000/im.width);im.src=e.dr}
let down=0;const p=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*1000/r.width,(ev.clientY-r.top)*750/r.height]};
c.onpointerdown=ev=>{if(!drawing)return;down=1;und.push(e.dr);red=[];x.lineCap=x.lineJoin='round';x.lineWidth=tool.size;x.globalCompositeOperation=tool.er?'destination-out':'source-over';x.strokeStyle=tool.col;x.beginPath();const[a,b]=p(ev);x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke();c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!down)return;const[a,b]=p(ev);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>{if(down){down=0;e.dr=c.toDataURL()}};
s.onpointerdown=ev=>{if(!drawing&&(ev.target==s||ev.target==c)){selSt=-1;s.querySelectorAll('.ob').forEach(q=>q.classList.remove('sel'));tools()}};
s.querySelectorAll('.ob').forEach(el=>{if(+el.dataset.i==selSt)el.classList.add('sel');el.onpointerdown=ev=>{if(drawing)return;ev.stopPropagation();const i=+el.dataset.i,k=e.obj[i],R=s.getBoundingClientRect();if(selSt!=i){selSt=i;s.querySelectorAll('.ob').forEach(q=>q.classList.toggle('sel',q==el));tools()}const b=el.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,t=ev.target.classList,an=Math.atan2(ev.clientY-cy,ev.clientX-cx),d0=Math.hypot(ev.clientX-cx,ev.clientY-cy)||1,r0=k.r||0,w0=k.t=='p'?k.w:k.s,ox=ev.clientX,oy=ev.clientY,x0=k.x,y0=k.y;el.setPointerCapture(ev.pointerId);el.onpointermove=m=>{if(t.contains('rt')){k.r=Math.round(r0+(Math.atan2(m.clientY-cy,m.clientX-cx)-an)*180/Math.PI);el.style.transform=`rotate(${k.r}deg)`}else if(t.contains('rs')){const f=Math.max(.2,Math.hypot(m.clientX-cx,m.clientY-cy)/d0);if(k.t=='p'){k.w=Math.max(6,Math.min(100,w0*f));el.style.width=k.w+'%'}else{k.s=Math.max(3,Math.min(40,w0*f));el.style.fontSize=k.s+'cqw'}}else{k.x=x0+(m.clientX-ox)/R.width*100;k.y=y0+(m.clientY-oy)/R.height*100;el.style.left=k.x+'%';el.style.top=k.y+'%'}};el.onpointerup=()=>{el.onpointermove=null}}})}

function delAcc(){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card"><h2>Delete account?</h2><p>This permanently erases your diaries, photos, series and messages from this browser. It is different from logging out.</p>'+(S.auth?'<p>Confirm your password<input id="dp" type="password"></p>':'')+'<button class="btn p" id="y">Yes, delete everything</button> <button class="btn g" id="n">Keep my account</button></div>';document.body.append(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=async()=>{if(S.auth&&await hash(m.querySelector('#dp').value+S.auth.salt)!=S.auth.h)return toast('Password does not match');try{localStorage.removeItem('dtn');localStorage.removeItem('dtn_sess')}catch(e){}location.reload()}}
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function mkAuth(em,pw){const salt=[...crypto.getRandomValues(new Uint8Array(8))].join('');S.auth={email:em,salt,h:await hash(pw+salt)};sess();save()}
async function login(){const em=$('#le').value.trim().toLowerCase();if(em!=S.auth.email||await hash($('#lp').value+S.auth.salt)!=S.auth.h)return toast('Email or password does not match');sess();$('#app').style.display='';render();chkRate()}
const logout=()=>{try{localStorage.removeItem('dtn_sess')}catch(e){}render()};
function auth(){if(S.user){$('#app').style.display='block';$('#app').innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h1>Log in ☁️</h1><p>Welcome back, '+esc(S.user.n)+'!</p><p>Gmail<input id="le" type="email"></p><p>Password<input id="lp" type="password"></p><button class="btn" onclick="login()">Log in</button><p><small>Device-only account: email codes and password reset need a backend that isn’t connected.</small></p></div>';return}onboard()}
const noAcc=()=>{$('#app').innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h1>Log in</h1><p>No account exists on this device. Email-code login and restoring data on another device need a backend that isn’t connected yet.</p><button class="btn" onclick="render()">Sign up instead</button></div>'};
const rc=()=>Math.floor((new Date(today()+'T00:00:00Z')-new Date(S.first+'T00:00:00Z'))/864e5/7);
function chkRate(){if(!S.user||(S.auth&&!ok()))return;const c=rc();if(c<1||S.rv.some(r=>r.c==c))return;if(!S.rn.includes(c)){S.rn.push(c);notify('How’s your little space on Daily Trackn’? Tap to rate us ⭐','rate')}if(S.pd!=today()){S.pd=today();save();ratePop(c)}if(page=='notifs')render()}
function ratePop(c){let s=0;const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card" style="background:var(--bg);text-align:center"><h2>How’s your little space on Daily Trackn’?</h2><p>Your feedback helps us make this space even better. How would you rate your experience?</p><div id="st" style="font-size:38px;cursor:pointer"></div><textarea id="rcm" placeholder="Tell us about your experience (optional)" style="min-height:60px"></textarea><textarea id="rsg" placeholder="Any suggestion? (optional)" style="min-height:60px;margin-top:6px"></textarea><p><button class="btn" id="rg">Send</button> <button class="btn g" id="rl">Maybe later</button></p></div>';document.body.append(m);const d=m.querySelector('#st'),dr=n=>{d.innerHTML=[1,2,3,4,5].map(i=>`<span data-i="${i}" style="transition:.15s;color:${i<=n?'#f5c542':'#c9d6e2'}">★</span>`).join('')};dr(0);d.onmouseover=ev=>ev.target.dataset.i&&dr(+ev.target.dataset.i);d.onmouseleave=()=>dr(s);d.onclick=ev=>{if(ev.target.dataset.i){s=+ev.target.dataset.i;dr(s)}};m.querySelector('#rl').onclick=()=>m.remove();m.querySelector('#rg').onclick=()=>{if(!s)return toast('Pick 1–5 stars first ⭐');if(!S.rv.some(r=>r.c==c))S.rv.push({c,stars:s,comment:m.querySelector('#rcm').value.trim().slice(0,500),sug:m.querySelector('#rsg').value.trim().slice(0,500),at:new Date().toISOString(),user:S.user.n});save();m.remove();toast('Thank you for helping Daily Trackn’ grow! Your little feedback means a lot. 💛')}}
S.demo=[];S.fr=S.fr||{};['Mochi','Luna','Kumo'].forEach(k=>{if(S.fr[k]==2){delete S.fr[k];delete S.msgs[k]}});S.notifs=S.notifs.filter(n=>!/\(demo\)|Welcome to Daily/.test(n.t));S.first=S.first||today();S.rv=S.rv||[];S.rn=S.rn||[];save();
if(S.user)load(sel);render();setTimeout(chkRate,600);
</script></body></html>
