<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Daily Trackn’</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#A9D6F5;--bg:#EAF6FF;--deep:#426A8A;--yel:#FFF0B8;--pink:#FFDCE8;--lav:#E9DFFF;--mint:#DDF4E5;--card:#FFFEFC;--tx:#34465A;--bd:#cfe6f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d2a38;--card:#26374a;--tx:#e6f0fa;--deep:#a9d6f5;--bd:#38506a;--yel:#4a4430;--pink:#4a3340;--lav:#3a3552;--mint:#2f4a3c}}
:root[data-theme=dark]{--bg:#1d2a38;--card:#26374a;--tx:#e6f0fa;--deep:#a9d6f5;--bd:#38506a;--yel:#4a4430;--pink:#4a3340;--lav:#3a3552;--mint:#2f4a3c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav{background:var(--card);border-right:2px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:var(--fh,100vh);align-self:start;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:21px;color:var(--deep);margin:0 8px 10px}.logo small{display:block;font-size:11px;font-weight:400;opacity:.7}
nav a{padding:9px 12px;border-radius:14px;cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;transition:.2s}
nav a:hover{background:var(--bg)}nav a.on{background:var(--pri);color:#26445e}
.dot{background:#ff7a8a;color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:auto}
main{padding:22px;max-width:980px;width:100%;margin:auto;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #426a8a14}
h1,h2,h3{color:var(--deep);margin:.2em 0}h1{font-size:26px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--pri);color:#26445e;border:0;border-radius:99px;padding:8px 16px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px)}
.btn.g{background:var(--bg);border:2px solid var(--bd)}.btn.p{background:var(--pink)}
input,textarea,select{width:100%;border:2px solid var(--bd);border-radius:14px;padding:8px 12px;background:var(--card);outline:none}
input:focus,textarea:focus{border-color:var(--pri)}textarea{resize:none;min-height:140px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{display:grid;grid-template-columns:300px 1fr;gap:14px}.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--deep)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:13px}
.cal .h{aspect-ratio:auto;font-weight:800;opacity:.6;cursor:default}.cal .t{background:var(--yel)}.cal .s{outline:3px solid var(--pri)}.cal .f{opacity:.3;cursor:default}.cal i{width:7px;height:7px;border-radius:50%}
#sl{-webkit-appearance:none;height:14px;border-radius:99px;padding:0;border:0}#sl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--deep);cursor:grab}
.mood{border-radius:20px;padding:14px;text-align:center;transition:background .3s;color:#34465a}.mood .em{font-size:54px;transition:transform .2s}
.stage{position:relative;aspect-ratio:5/2;background:repeating-linear-gradient(var(--card) 0 27px,var(--bg) 27px 28px);border:2px dashed var(--bd);border-radius:18px;overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.stage canvas.on{z-index:5;cursor:crosshair}
.stk{position:absolute;z-index:2;cursor:grab;user-select:none;line-height:1;transform-origin:center}.stk.sel{outline:2px dashed var(--deep);border-radius:8px}
.tray{display:flex;flex-wrap:wrap;gap:4px;max-height:110px;overflow:auto}.tray span{font-size:26px;cursor:pointer;padding:2px 4px;border-radius:10px}.tray span:hover{background:var(--bg)}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph div{position:relative;width:110px;height:110px;background:var(--bg);border-radius:14px}.ph img{width:100%;height:100%;object-fit:contain;border-radius:14px}.ph b{position:absolute;top:2px;right:4px;cursor:pointer}
.ev{display:flex;gap:6px;margin-bottom:6px}.ev select{width:64px}.ev input[type=time]{width:110px}
.av{width:40px;height:40px;border-radius:50%;background:var(--lav);display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}#dev{--fh:calc(100vh - 76px);min-height:100vh;padding:56px 12px 16px;display:flex;justify-content:center;align-items:flex-start}#wrap{position:relative;width:100%;transition:width .4s}#dev.d #wrap{width:min(1180px,100%)}#dev.p #wrap{width:392px}#frame{width:100%;height:var(--fh);background:var(--bg);overflow:auto;overflow-x:hidden;border:0 solid #34465a;transition:height .4s,border-radius .4s,border-width .4s,box-shadow .4s}#dev.d #frame{border:2px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px #426a8a26}#dev.p #frame{height:min(820px,var(--fh));border:11px solid #34465a;border-radius:46px;box-shadow:0 20px 50px #426a8a55}.notch{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#34465a;border-radius:0 0 14px 14px;z-index:6}#dev.p .notch{display:block}#dev.p main{padding-top:30px}#dev.bare{padding:0}#dev.bare #wrap{width:100%}#dev.bare #frame{height:auto;overflow:visible;border:0;border-radius:0;box-shadow:none}#dev.bare #app{min-height:100vh}#dev.m #app{display:flex;flex-direction:column}#dev.m main{order:1;flex:1;padding:12px;width:100%;overflow-x:hidden}#dev.m nav{order:2;position:sticky;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;border-top:2px solid var(--bd);border-right:0}#dev.m .logo,#dev.m nav .me{display:none}#dev.m nav a{flex-direction:column;font-size:10px;gap:0;padding:4px 8px;white-space:nowrap}#dev.m nav a.btn{margin-top:0!important}#dev.m .two{grid-template-columns:1fr}#dev.m .ev{flex-wrap:wrap}.sw{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:30;display:flex;background:var(--pri);border:2px solid var(--bd);border-radius:99px;padding:3px;gap:2px}.sw button{border:0;background:none;border-radius:99px;padding:4px 12px;font-weight:800;cursor:pointer;color:#26445e;transition:.25s;font-size:13px}.sw button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 6px #426a8a30}@media(max-width:760px){.sw{display:none}}.tag{background:var(--lav);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;display:inline-block;margin:2px}
.rx button{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:2px 9px;cursor:pointer;margin:2px}.rx button.on{background:var(--pri)}
.cm{background:var(--bg);border-radius:14px;padding:6px 10px;margin:4px 0;font-size:14px}
.msgs{height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}.m{max-width:70%;padding:6px 12px;border-radius:16px;background:var(--bg)}.m.me{align-self:flex-end;background:var(--pri);color:#26445e}
.empty{text-align:center;padding:30px;opacity:.8}.empty div{font-size:46px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:99;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.cf{position:fixed;top:-20px;font-size:24px;z-index:99;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{max-width:420px;width:100%;max-height:90vh;overflow:auto}
@media(max-width:0px){#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:20;padding:6px;border-top:2px solid var(--bd);border-right:0}.logo{display:none}nav a{flex-direction:column;font-size:10px;gap:0;padding:4px 8px;white-space:nowrap}.two{grid-template-columns:1fr}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="sw" role="group" aria-label="Device"><button data-m="phone" onclick="setDev('phone')">📱 Phone</button><button data-m="desktop" onclick="setDev('desktop')">💻 Desktop</button></div><div id="dev" class="d"><div id="wrap"><i class="notch"></i><div id="frame"><div id="app"></div></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());
const hr=()=>+new Intl.DateTimeFormat('en',{timeZone:'Asia/Ho_Chi_Minh',hour:'numeric',hour12:false}).format(new Date())%24;
const DEMO=[{u:'Mochi',a:'🐱',date:'2026-10-28',m:8,t:'Matcha latte + a long walk by the river. Felt so light today 🍃',ev:[['☕','Matcha with Luna'],['🌸','River walk']],st:[{e:'☁️',x:10,y:15,s:40,r:0},{e:'🌸',x:70,y:45,s:36,r:15}],rx:{'💙':4,'🌸':2},cm:[{u:'Luna',t:'So cute!!'}]},
{u:'Luna',a:'🐰',date:'2026-10-29',m:6,t:'Ordinary day, finished my English homework. Small wins count.',ev:[['📚','Studied 2 hours']],st:[{e:'⭐',x:60,y:20,s:38,r:-10}],rx:{'✨':3},cm:[]},
{u:'Kumo',a:'🐻',date:'2026-10-30',m:4,t:'A little down today, but a warm shower helped.',ev:[['💤','Nap']],st:[],rx:{'🫶':6},cm:[]}];
const FR={Mochi:'🐱',Luna:'🐰',Kumo:'🐻'};
let S;try{S=JSON.parse(localStorage.dtn)}catch(e){}
S=S||{user:null,d:{},series:[],demo:DEMO,notifs:[{id:1,t:'Welcome to Daily Trackn’! 💙 (demo data is labelled)',r:0,to:'diary',at:Date.now()}],msgs:{},fr:{Mochi:2,Luna:2},theme:'light'};
const save=()=>{try{localStorage.dtn=JSON.stringify(S)}catch(e){toast('Storage full — try fewer photos')}};
let page='home',sel=today(),e,tool=null,drawing=false,range=7,cm='',chat='Mochi',selSt=-1,und=[],red=[];
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2200)};
const notify=(t,to)=>{S.notifs.unshift({id:Date.now()+Math.random(),t,r:0,to,at:Date.now()});save()};
const ZOD=[['♑','Capricorn',20],['♒','Aquarius',19],['♓','Pisces',20],['♈','Aries',20],['♉','Taurus',21],['♊','Gemini',21],['♋','Cancer',22],['♌','Leo',23],['♍','Virgo',23],['♎','Libra',23],['♏','Scorpio',22],['♐','Sagittarius',22],['♑','Capricorn',31]];
const zod=d=>{if(!d)return'';const[,m,dd]=d.split('-').map(Number);const z=dd<ZOD[m-1][2]?ZOD[m-1]:ZOD[m];return z[0]+' '+z[1]};
const MOODS=['','Terrible','Very sad','Sad','A little down','Neutral','Okay','Good','Happy','Very happy','Amazing'],EM=['','😭','😢','🙁','😕','😐','🙂','😊','😄','🥰','🤩'];
const col=m=>`hsl(${(m-1)/9*125},${m<5?75:65}%,${m==5||m==6?78:72}%)`;
const MSG=m=>m<=3?"It's okay to have difficult days. Be kind to yourself.":m<=6?"Some days are just ordinary, and that's okay.":"Look at you shining today!";
const STK='🐻🐰🐱🐶🦊🐼🐥🦋🌸🌷🌻🌼💗💙💛⭐🌟✨🌙☁️☀️🌈⛅🌧️☕🧋🍰🍓🍩🍙📚✏️🎧💻🏃🎬🛍️💤🎉🎀🍂🎃🎄🌸'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
const ICO=['☕','📚','🌸','💗','🎬','🛍️','💤','🏃','🍜','🎧','✈️','🎨','💻','🌧️','⭐'];
const QUOTES=['Small steps still move you forward.',"You don't have to bloom every day.",'Every little moment matters.'];
const blank=()=>({mood:7,text:'',ev:[{i:'✨',t:'',time:''}],ph:[],st:[],dr:'',priv:'public',v:{m:1,t:0,p:1,e:1},draft:0,rx:{},me:'',cm:[]});
const load=d=>{e=JSON.parse(JSON.stringify(S.d[d]||blank()));und=[];red=[];selSt=-1};
const dates=()=>Object.keys(S.d).filter(k=>!S.d[k].draft).sort();
const streak=(set,end=today())=>{let n=0,d=new Date(end+'T00:00:00Z');if(!set.has(end))d.setUTCDate(d.getUTCDate()-1);while(set.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}return n};
function confetti(){for(let i=0;i<40;i++){const c=document.createElement('div');c.className='cf';c.textContent=['🎉','✨','🌸','💙','⭐'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.append(c);setTimeout(()=>c.remove(),3400)}}
const NAV=[['home','🏠','Home'],['diary','📔','My Diary'],['network','🌍','Network'],['series','🌷','Series'],['messages','💬','Messages'],['notifs','🔔','Alerts'],['profile','🙂','Profile'],['settings','⚙️','Settings']];
function go(p){page=p;if(p=='diary'&&!e)load(sel);render();scrollTo(0,0);$('#frame').scrollTop=0}
function render(){document.documentElement.dataset.theme=S.theme;
if(!S.user)return onboard();const un=S.notifs.filter(n=>!n.r).length;
$('#app').innerHTML=`<nav><div class="logo">☁️ Daily Trackn’<small>track your days, feelings & memories</small></div><a class="me" onclick="go('profile')"><span class="av" style="width:30px;height:30px;font-size:16px">${myAv()}</span>${esc(S.user.n)}</a>
${NAV.map(n=>`<a class="${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}${n[0]=='notifs'&&un?`<span class="dot">${un}</span>`:''}</a>`).join('')}
<a class="btn" style="margin-top:auto;justify-content:center" onclick="sel=today();load(sel);go('diary')">✏️ Today’s diary</a></nav><main>${P[page]()}</main>`;
if(page=='diary')initDiary();if(page=='messages'){const m=$('.msgs');if(m)m.scrollTop=1e9}}
const P={};
/* ---------- ONBOARDING / PROFILE ---------- */
let ob={a:'🐱',tags:[]};
function onboard(edit){const u=edit?S.user:{};ob.a=u.a||ob.a;ob.tags=u.tags||ob.tags;if(edit&&ob.img===undefined)ob.img=u.img||'';
const h=`<div class="card" style="max-width:480px;margin:20px auto"><h1>${edit?'Edit profile':'Welcome to Daily Trackn’ ☁️'}</h1><p>A little space to track your days, feelings & memories.</p>
<p><b>Avatar</b></p><div class="row"><span class="av" style="width:84px;height:84px;font-size:46px">${myAv(ob)}</span><div><input type="file" id="af" accept="image/jpeg,image/png,image/webp" hidden onchange="pickImg(this.files[0]);this.value=''"><button class="btn" onclick="$('#af').click()">⬆ Upload from device</button> ${ob.img?'<button class="btn g" onclick="rmImg()">Remove</button>':''}<br><small>JPG, PNG or WEBP · crop & zoom next</small></div></div><p><b>Cute defaults</b><br>${['🐱','🐰','🐻','🦊','🐼','🐥','🌸','⭐'].map(a=>`<span class="av" style="cursor:pointer;${a==ob.a?'outline:3px solid var(--deep)':''}" onclick="ob.a='${a}';obRe()">${a}</span>`).join(' ')}</p>
<p>Nickname *<input id="on" value="${esc(u.n)}" maxlength="20"></p><p>Date of birth * <input id="od" type="date" value="${u.dob||''}" max="${today()}" oninput="$('#oz').textContent=zod(this.value)"> <b id="oz">${zod(u.dob)}</b></p>
<p>MBTI *<select id="om">${['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'].map(m=>`<option ${u.mbti==m?'selected':''}>${m}</option>`).join('')}</select></p>
<p>Bio<textarea id="ob" style="min-height:60px" maxlength="200">${esc(u.bio)}</textarea></p>
<p>Personality tags<br>${['Dreamy','Chill','Creative','Bookworm','Night owl','Sunshine'].concat(ob.tags.filter(t=>!['Dreamy','Chill','Creative','Bookworm','Night owl','Sunshine'].includes(t))).map(t=>`<span class="tag" style="cursor:pointer;${ob.tags.includes(t)?'background:var(--pri)':''}" onclick="tg('${esc(t)}',${!!edit})">${esc(t)}</span>`).join('')} <input id="ot" placeholder="+ own tag (Enter)" style="width:150px" onkeydown="if(event.key=='Enter'){tg(this.value.trim(),${!!edit})}"></p>
<button class="btn" onclick="obSave(${!!edit})">${edit?'Save':'Start tracking 💙'}</button> ${edit?`<button class="btn g" onclick="window.editing=0;go('profile')">Cancel</button>`:''}</div>`;
if(edit)return h;$('#app').innerHTML=h;$('#app').style.display='block'}
const obRe=()=>{const k={n:$('#on').value,dob:$('#od').value,mbti:$('#om').value,bio:$('#ob').value};const ed=!!S.user;if(ed)Object.assign(S.user,k,{a:ob.a,img:ob.img||''});else window._k=k;if(ed)render();else{onboard();Object.entries(window._k||{}).forEach(([a,b])=>{const m={n:'on',dob:'od',mbti:'om',bio:'ob'}[a];$('#'+m).value=b})}};
const tg=(t,ed)=>{if(!t)return;ob.tags=ob.tags.includes(t)?ob.tags.filter(x=>x!=t):[...ob.tags,t];obRe()};
function obSave(ed){const n=$('#on').value.trim(),dob=$('#od').value;if(!n||!dob)return toast('Please add a nickname and birthday 🌸');
S.user={n,dob,mbti:$('#om').value,bio:$('#ob').value,a:ob.a,img:ob.img||'',tags:ob.tags,priv:S.user?.priv||'public'};save();window.editing=0;$('#app').style.display='';sel=today();load(sel);page=ed?'profile':'home';render()}
P.profile=()=>{const u=S.user,pub=dates().filter(d=>S.d[d].priv=='public').length;
return page=='profile'&&window.editing?onboard(true):`<h1>My Profile</h1><div class="card"><div class="row"><span class="av" style="width:72px;height:72px;font-size:40px">${myAv()}</span><div><h2>${esc(u.n)}</h2><span class="tag">${u.mbti}</span><span class="tag">${zod(u.dob)}</span>${u.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><p>${esc(u.bio)||'<i>No bio yet</i>'}</p>
<div class="grid"><div class="stat"><b>${Object.keys(S.fr).filter(k=>S.fr[k]==2).length}</b>friends</div><div class="stat"><b>${pub}</b>public diaries</div><div class="stat"><b>${S.series.length}</b>series</div><div class="stat"><b>${streak(new Set(dates()))}🔥</b>streak</div></div><p><button class="btn" onclick="window.editing=1;ob.img=S.user.img||'';render()">Edit profile</button> <button class="btn p" onclick="delAcc()">Delete account</button></p><small>Private diaries never show on your public profile.</small></div>`};
const _r=render;
function delAcc(){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card"><h2>Delete account?</h2><p>This permanently erases your diaries, series and messages from this browser.</p><button class="btn p" id="y">Yes, delete everything</button> <button class="btn g" id="n">Keep my account</button></div>';document.body.append(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{try{localStorage.removeItem('dtn')}catch(e){};location.reload()}}
/* ---------- HOME ---------- */
function chart(){const ds=dates(),lim=new Date(today()+'T00:00:00Z');lim.setUTCDate(lim.getUTCDate()-range);const pts=ds.filter(d=>d>lim.toISOString().slice(0,10)).map(d=>[d,S.d[d].mood]);
if(pts.length<2)return'<div class="empty"><div>☁️</div>Track at least 2 days to see your mood chart.</div>';
const W=600,H=160,x=i=>20+i*(W-40)/(pts.length-1),y=m=>H-15-(m-1)*(H-30)/9;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline fill="none" stroke="#A9D6F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="6" fill="${col(p[1])}" stroke="#fff" stroke-width="2"><title>${p[0]}: ${p[1]}</title></circle>`).join('')}</svg>`}

function mkS(){const n=$('#sn').value.trim();if(!n)return toast('Name your series 🌷');S.series.push({n,e:$('#se').value||'🌷',t:+$('#st').value||0,p:$('#sp').value,s:today(),u:[],ms:[]});save();render()}
function upS(i){const s=S.series[i],t=$('#u'+i).value.trim();if(!t)return toast('Write a little update first');s.u.push({d:today(),t});const c=streak(new Set(s.u.map(u=>u.d)));save();
if(c&&c%10==0&&!s.ms.includes(c)){s.ms.push(c);save();confetti();const m=c==10?'10 days! You’re building something beautiful! 🌷':c==20?'20 days of consistency! Keep blooming! 🌸':c+' days! Look how far you’ve come! 🎉';toast(m);notify('Milestone: '+m,'series')}else toast('Series updated 🌱');render()}
/* ---------- MESSAGES / NOTIFS ---------- */
P.messages=()=>{const fr=Object.keys(S.fr).filter(k=>S.fr[k]==2),ms=S.msgs[chat]||[];return`<h1>Messages 💬</h1><small>Demo chat: friends reply automatically. No real-time server connected.</small><div class="two" style="margin-top:8px"><div class="card">${fr.map(f=>`<div class="row cm" style="cursor:pointer;${f==chat?'background:var(--pri)':''}" onclick="chat='${f}';render()"><span class="av">${FR[f]||'🙂'}</span>${esc(f)}</div>`).join('')||'Add friends in Network first 💌'}</div>
<div class="card"><b>${esc(chat)}</b><div class="msgs">${ms.map((m,i)=>`<div class="m ${m.me?'me':''}">${m.me?`<span class="av" style="width:20px;height:20px;font-size:12px;float:right;margin-left:6px">${myAv()}</span>`:''}${esc(m.t)}<br><small>${m.at}${m.me?' · ✓✓':''} ${m.me?`<a style="cursor:pointer" onclick="S.msgs[chat].splice(${i},1);save();render()">🗑</a>`:''}</small></div>`).join('')||'<div class="empty">Say hi 👋</div>'}</div><div class="row"><input id="mi" placeholder="Message… 😊" onkeydown="if(event.key=='Enter')sm()"><button class="btn" onclick="sm()">Send</button></div></div></div>`};
function sm(){const t=$('#mi').value.trim();if(!t||S.fr[chat]!=2)return;const tm=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit'});(S.msgs[chat]=S.msgs[chat]||[]).push({me:1,t,at:tm()});save();render();const c=chat;setTimeout(()=>{S.msgs[c].push({t:['Aww 💙','Tell me more!','Haha same 🌸'][Math.floor(Math.random()*3)],at:tm()});save();if(page=='messages')render()},1200)}
P.notifs=()=>`<h1>Notifications 🔔</h1><button class="btn g" onclick="S.notifs.forEach(n=>n.r=1);save();render()">Mark all read</button><div style="margin-top:10px">${S.notifs.map(n=>`<div class="card" style="cursor:pointer;${n.r?'opacity:.6':''}" onclick="S.notifs.find(x=>x.id==${n.id}).r=1;save();go('${n.to}')">${n.r?'':'🔵 '}<span class="av" style="width:24px;height:24px;font-size:13px">${(()=>{const f=Object.keys(FR).find(k=>n.t.startsWith(k));return f?FR[f]:myAv()})()}</span> ${esc(n.t)}<br><small>${new Date(n.at).toLocaleString('en-GB',{timeZone:'Asia/Ho_Chi_Minh'})}</small></div>`).join('')||'<div class="empty"><div>🔕</div>All quiet.</div>'}</div>`;
P.settings=()=>`<h1>Settings ⚙️</h1><div class="card"><h3>Theme</h3><button class="btn ${S.theme=='light'?'':'g'}" onclick="S.theme='light';save();render()">☀️ Light pastel</button> <button class="btn ${S.theme=='dark'?'':'g'}" onclick="S.theme='dark';save();render()">🌙 Dark pastel</button></div>
<div class="card"><h3>Default diary privacy</h3><select onchange="S.user.priv=this.value;save()"><option ${S.user.priv=='public'?'selected':''}>public</option><option ${S.user.priv=='private'?'selected':''}>private</option></select></div>
<div class="card"><h3>Your data</h3><button class="btn g" onclick="dl()">⬇ Download my data</button> <button class="btn p" onclick="delAcc()">Delete account</button></div>
<div class="card"><small>Demo build: data is stored only in this browser (localStorage). Password, blocking & real multi-user sync need a backend.</small></div>`;
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='daily-trackn-data.json';a.click()}
const myAv=u=>{u=u||S.user;return u.img?`<img alt="" src="${u.img}">`:u.a};
const rmImg=()=>{ob.img='';obRe()};
function pickImg(f){if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Please choose a JPG, PNG or WEBP image 🌸');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>crop(im);im.src=r.result};r.readAsDataURL(f)}
function crop(im){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card" style="text-align:center"><h3>Crop your avatar</h3><canvas id="kc" width="260" height="260" style="touch-action:none;max-width:100%;border-radius:16px;cursor:grab"></canvas><p><small>Drag to reposition · zoom to fit</small><br><input type="range" id="kz" min="1" max="3" step="0.01" value="1"></p><button class="btn" id="ky">Use this photo</button> <button class="btn g" id="kn">Cancel</button></div>';document.body.append(m);
const c=m.querySelector('#kc'),x=c.getContext('2d'),b=260/Math.min(im.width,im.height);let z=1,ox=0,oy=0,d=null;
const draw=ctx=>{const s=b*z,w=im.width*s,h=im.height*s,mx=(w-260)/2,my=(h-260)/2;ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));ctx.fillStyle='#fff';ctx.fillRect(0,0,260,260);ctx.drawImage(im,130-w/2+ox,130-h/2+oy,w,h)};
const paint=()=>{draw(x);x.fillStyle='rgba(30,50,70,.45)';x.beginPath();x.rect(0,0,260,260);x.arc(130,130,125,0,7,true);x.fill('evenodd')};paint();
m.querySelector('#kz').oninput=ev=>{z=+ev.target.value;paint()};c.onpointerdown=ev=>{d=[ev.clientX,ev.clientY,ox,oy];c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!d)return;const k=c.getBoundingClientRect().width/260;ox=d[2]+(ev.clientX-d[0])/k;oy=d[3]+(ev.clientY-d[1])/k;paint()};c.onpointerup=()=>d=null;
m.querySelector('#kn').onclick=()=>m.remove();m.querySelector('#ky').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=260;draw(o.getContext('2d'));ob.img=o.toDataURL('image/jpeg',.85);m.remove();obRe();toast('Avatar ready — press Save 💙')}}
function applyDev(){const nr=innerWidth<760;$('#dev').className=nr?'bare m':S.dev=='phone'?'p m':'d';document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.m==(S.dev=='phone'?'phone':'desktop')))}
const setDev=m=>{S.dev=m;save();applyDev()};
applyDev();addEventListener('resize',applyDev);
if(S.user)load(sel);render();
</script></body></html>
